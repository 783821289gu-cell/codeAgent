[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "repopilot"
version = "0.1.0"
description = "A compact multi-agent coding agent for real repositories"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "openai-agents>=0.20,<0.21",
  "pgvector>=0.4.2,<0.5",
  "psycopg[binary]>=3.2.9,<4",
  "pydantic>=2.11,<3",
  "pydantic-settings>=2.6,<3",
  "rich>=13.9,<15",
  "sentence-transformers>=5.1.2,<6",
  "SQLAlchemy>=2.0.41,<3",
  "tiktoken>=0.12,<1",
  "typer>=0.16,<1",
]

[project.optional-dependencies]
dev = [
  "pytest>=9,<10",
  "pytest-asyncio>=1.2,<2",
  "ruff>=0.16,<0.17",
]

[project.scripts]
repopilot = "repopilot.interfaces.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/repopilot"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py312"
line-length = 100
exclude = ["demo/bug_repo/.repopilot"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
